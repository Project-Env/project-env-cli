name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name of the release"
        required: true

permissions: {}

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - id: revision
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        shell: bash
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag name: ${TAG}" >&2
            exit 1
          fi
          echo "revision=${TAG#v}" >> $GITHUB_OUTPUT
      - uses: vedantmgoyal2009/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ProjectEnv.ProjectEnvCli
          installers-regex: '-setup\.exe$'
          token: ${{ secrets.WINGET_RELEASER_TOKEN }}
          # Account that owns the winget-pkgs fork the token pushes to. Set the
          # WINGET_FORK_USER repository variable to the bot account; until then this
          # keeps the current behaviour (the Project-Env/winget-pkgs fork).
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          release-tag: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          version: ${{ steps.revision.outputs.revision }}
